name: Manutenção agendada (MNT-13)

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: manutencao-agendada
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup diário do PostgreSQL
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BACKUP_ROOT: ${{ github.workspace }}/backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump 18
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Run backup
        run: bash scripts/backup-db.sh

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/daily/*.sql.gz
          retention-days: 30

  integridade:
    name: Verificação semanal de integridade
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify referential integrity
        run: npx tsx scripts/verificar-integridade.ts
